name: CI/CD Pipeline (FOOD AI)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "develop" ]

# Cấu hình quyền để Github Action có thể viết comment vào Pull Request
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  backend-ci:
    name: Backend CI (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./my-web/backend

    # Cấu hình Database phụ (Service container) phục vụ cho test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: food_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔒 Security Scan (npm audit)
        run: npm audit --audit-level=high || echo "Vulnerabilities found but continuing"

      - name: 🧹 Check Linter & Formatting (ESLint)
        run: npm run lint

      - name: 🧪 Run Unit Tests & Generate Coverage
        run: npm run test:cov > coverage.txt

      - name: 📝 Comment Coverage Report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const coverage = fs.readFileSync('./my-web/backend/coverage.txt', 'utf8');
              const body = `### 📊 Backend Test Coverage Report\n\`\`\`text\n${coverage}\n\`\`\``;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (e) {
              console.log("Could not find coverage file", e);
            }

  frontend-ci:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./my-web/frontend

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔒 Security Scan (npm audit)
        run: npm audit --audit-level=high || echo "Vulnerabilities found but continuing"

      - name: 🧹 Check Linter & Formatting
        run: npm run lint

      - name: 🧪 Run Unit Tests & Generate Coverage
        run: npm run test:cov > coverage-fe.txt

      - name: 📝 Comment Coverage Report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const coverage = fs.readFileSync('./my-web/frontend/coverage-fe.txt', 'utf8');
              const body = `### 🎨 Frontend Test Coverage Report\n\`\`\`text\n${coverage}\n\`\`\``;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (e) {
              console.log("Could not find coverage file", e);
            }

      - name: 🏗️ Build Project
        run: npm run build
